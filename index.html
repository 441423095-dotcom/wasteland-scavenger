<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e0b">
<title>末日公寓</title>
<link rel="stylesheet" href="css/style.css?v=174">
</head>
<body>
<div id="app">

  <!-- ================= 片头 ================= -->
  <section class="screen is-active" id="screen-intro">
    <div class="intro-inner">
      <div class="intro-title">末日公寓</div>
      <div class="intro-text" id="intro-text"></div>
      <button type="button" class="btn btn-main intro-go" id="btn-intro-go">冲出房间搜刮</button>
    </div>
  </section>

  <!-- ================= 抢物资 ================= -->
  <section class="screen" id="screen-mini">
    <div class="mini-hud">
      <span class="mini-clock">⏱ <b id="mini-time">15</b> 秒</span>
      <span class="mini-counts" id="mini-counts">食物 0 · 水 0 · 木板 0 · 药品 0</span>
    </div>

    <div class="mini-sky" id="mini-sky">
      <div class="mini-plane">
        <svg viewBox="0 0 240 110" aria-hidden="true">
          <path d="M186 44 L 214 6 L 226 6 L 230 44 Z" fill="#7d8a7c"/>
          <path d="M14 62 C 18 46, 42 40, 80 40 L 196 40 C 216 40, 228 50, 228 62 C 228 74, 216 82, 196 82 L 80 82 C 42 82, 18 76, 14 62 Z" fill="#98a596"/>
          <path d="M18 58 C 24 49, 40 45, 62 45 L 62 62 L 18 62 Z" fill="#26333a"/>
          <rect x="78" y="51" width="11" height="7" rx="3" fill="#33413f"/>
          <rect x="95" y="51" width="11" height="7" rx="3" fill="#33413f"/>
          <rect x="112" y="51" width="11" height="7" rx="3" fill="#33413f"/>
          <path d="M100 62 L 152 106 L 78 106 Z" fill="#7f8d7f"/>
          <rect x="108" y="72" width="28" height="15" rx="7" fill="#5f6d5f"/>
          <rect x="168" y="52" width="38" height="22" rx="2" fill="#7d8a7c"/>
          <rect x="172" y="56" width="30" height="14" fill="#68746a"/>
          <circle cx="86" cy="62" r="7" fill="#3f4c46"/>
          <circle cx="86" cy="62" r="3" fill="#9fb0a2"/>
          <path d="M14 62 C 18 56, 26 52, 36 50" stroke="#c9d6c8" stroke-width="2" fill="none"/>
        </svg>
      </div>
    </div>

    <div class="mini-field" id="mini-field"></div>

    <div class="mini-basket" id="mini-basket"></div>

    <div class="mini-flash" id="mini-flash"></div>

    <div class="mini-over" id="mini-over">
      <div class="mini-over-title">大门重重关上</div>
      <div class="mini-over-text" id="mini-over-text"></div>
      <button type="button" class="mini-over-btn" id="btn-mini-go">开始末日求生</button>
    </div>
  </section>

  <!-- ================= 死亡结算（中途阵亡） ================= -->
  <section class="screen" id="screen-death">
    <div class="go-inner">
      <span class="go-tag" id="go-tag">结局 · 中途阵亡</span>
      <h2 class="go-title" id="go-title">全员阵亡</h2>
      <div class="go-days" id="go-days">撑了 <b>1</b> <span>天</span></div>
      <p class="go-line" id="go-line"></p>
      <div class="go-stats" id="go-stats"></div>
      <p class="go-who" id="go-who"></p>
      <div class="go-rule"></div>
      <p class="go-ask">要不要重新开始？</p>
      <div class="go-buts">
        <button type="button" class="btn btn-main go-restart" data-act="newrun">重新开始</button>
        <button type="button" class="btn go-log" data-act="log">看看日记</button>
      </div>
    </div>
  </section>

  <!-- ================= 页面一：避难所 ================= -->
  <section class="screen is-active" id="screen-shelter">

    <div class="ticker"><span class="ticker-text" id="ticker-text"></span></div>

    <div class="day-big" id="day-big">生存第 <b>1</b> 天</div>

    <aside class="people-panel" id="people"></aside>

    <div class="stage" id="stage">
      <div class="inv" id="shelf"></div>
      <div class="scene" id="scene">
        <img class="scene-img" id="scene-img" src="assets/scene.jpg?v=3" alt="">
      </div>
      <button type="button" class="diary" id="btn-log" aria-label="避难所日志">
        <img class="diary-img" id="diary-img" src="assets/diary.png?v=1" alt="">
      </button>

    </div>

    <div class="bubbles" id="bubbles">
      <span class="bubble" id="bubble-0"></span>
      <span class="bubble" id="bubble-1"></span>
      <span class="bubble" id="bubble-2"></span>
      <span class="bubble" id="bubble-3"></span>
    </div>

    <div class="hud-top">
      <div class="day-badge">第 <b id="day-num">1</b> 天</div>
      <button type="button" class="event-btn is-hidden" id="btn-event">门口有人</button>
      <div class="rescue-tag" id="rescue-tag"></div>
    </div>

    <div class="bottom-hud">
      <div class="hintbar" id="hintbar"></div>
      <div class="quest" id="quest"></div>
      <div class="night-risk" id="night-risk"></div>
      <div class="actions">
        <button type="button" class="btn btn-main" id="btn-explore">出门探索</button>
        <button type="button" class="btn" id="btn-feed">投喂</button>
        <button type="button" class="btn" id="btn-clean">浴室</button>
        <button type="button" class="btn" id="btn-home-task">在家</button>
        <button type="button" class="btn" id="btn-repair">改造</button>
        <button type="button" class="btn" id="btn-night">结束今天</button>
      </div>
      <div class="story-line" id="story-line"></div>
    </div>

  </section>

  <!-- ================= 页面二：外出地图 ================= -->
  <section class="screen" id="screen-map">

    <!-- 底图 + 隐形热区：热区按整张图的百分比定位 -->
    <div class="map-stage" id="map-stage">
      <img class="map-bg" id="map-bg" src="assets/map-bg.jpg?v=2" alt="小区地图">
      <div class="map-hotspots" id="map-grid"></div>
    </div>

    <div class="map-head">
      <div class="day-badge">第 <b id="day-num-map">1</b> 天</div>
    </div>

    <div class="map-risk" id="map-risk">
      <span class="map-risk-pill" id="map-risk-text">点地图上的地点，再选谁去</span>
    </div>

    <button type="button" class="map-info-btn" id="btn-map-info" aria-label="地图图例">?</button>

    <div class="actions">
      <button type="button" class="btn" id="btn-go-home">带回避难所</button>
    </div>

  </section>

  <!-- ================= 开发者测试面板 ================= -->
  <button type="button" class="debug-btn" id="btn-debug">🛠️ 测试</button>
  <button type="button" class="mute-btn" id="btn-mute">音效：开</button>

  <div class="debug-panel" id="debug-panel">
    <div class="dbg-head">
      <span>测试面板</span>
      <button type="button" class="dbg-close" id="btn-debug-close">×</button>
    </div>

    <div class="dbg-label">选择目标</div>
    <div class="dbg-people" id="dbg-people"></div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn" data-dbg="dying">目标濒死（饿/水 90）</button>
      <button type="button" class="dbg-btn" data-dbg="sick">目标生病</button>
      <button type="button" class="dbg-btn" data-dbg="mad">目标发疯</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn" data-dbg="full">全员满状态</button>
      <button type="button" class="dbg-btn" data-dbg="wipe">清空物资</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide" data-dbg="stock">一键神装（物资各 10）</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide" data-dbg="allopen">全开（物资满 + 地图全开）</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide" data-dbg="event">强制触发夜间事件</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide" data-dbg="day">强制触发白天事件</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide" data-dbg="day29">跳到救援前（带信号弹）</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide" data-dbg="config">数值自检</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide" data-dbg="testpage">打开测试台</button>
    </div>

    <div class="dbg-row">
      <button type="button" class="dbg-btn dbg-wide dbg-danger" data-dbg="restart">重新开始（清空存档）</button>
    </div>
  </div>

  <!-- 屏幕中央的一次性说明 -->
  <div class="center-tip" id="center-tip"></div>

  <!-- ================= 弹窗 ================= -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

</div>

<script src="js/config.js?v=174"></script>
<script src="js/balance.js?v=174"></script>
<script src="js/game.js?v=174"></script>
<script src="js/art.js?v=174"></script>
<script src="js/sfx.js?v=174"></script>
<script src="js/save.js?v=174"></script>
<script src="js/ui.js?v=174"></script>
</body>
</html>
