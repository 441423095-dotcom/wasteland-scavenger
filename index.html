<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e0b">
<title>我在末日捡垃圾</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ================= 页面一：避难所 ================= -->
  <section class="screen is-active" id="screen-shelter">

    <div class="ticker"><span class="ticker-text" id="ticker-text"></span></div>

    <aside class="people-panel" id="people"></aside>

    <div class="stage" id="stage">
      <div class="shelf" id="shelf"></div>
      <div class="gear" id="gear"></div>
      <div class="scene" id="scene">
        <img class="scene-img" id="scene-img" src="assets/scene.jpg" alt="">
      </div>
      <button type="button" class="diary" id="btn-log" aria-label="避难所日志">
        <span class="diary-lines"></span>
      </button>
    </div>

    <div class="hud-top">
      <div class="day-badge">第 <b id="day-num">1</b> 天</div>
      <div class="rescue-tag" id="rescue-tag"></div>
    </div>

    <div class="bottom-hud">
      <div class="hintbar" id="hintbar"></div>
      <div class="actions">
        <button type="button" class="btn btn-main" id="btn-explore">出门探索</button>
        <button type="button" class="btn" id="btn-status">人物状态</button>
        <button type="button" class="btn" id="btn-night">结束今天</button>
      </div>
      <div class="actions actions-sub">
        <button type="button" class="btn btn-sub" id="btn-clean">浴室</button>
        <button type="button" class="btn btn-sub" id="btn-repair">修理避难所</button>
        <button type="button" class="btn btn-sub" id="btn-talk">围炉夜话</button>
      </div>
    </div>

  </section>

  <!-- ================= 页面二：外出地图 ================= -->
  <section class="screen" id="screen-map">

    <div class="map-head">
      <div class="day-badge">第 <b id="day-num-map">1</b> 天</div>
      <div class="lead-tag">带队：<b id="lead-name">陈默</b></div>
    </div>

    <div class="map-wrap" id="map-wrap">
      <div class="map-path" id="map-path"></div>
      <div class="map-nodes" id="map-grid"></div>
    </div>

    <div class="map-foot">点一个地方，再选谁去。</div>

    <div class="actions">
      <button type="button" class="btn" id="btn-go-home">带回避难所</button>
    </div>

  </section>

  <!-- ================= 弹窗 ================= -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/game.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
